<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>College Admin</h2>
        <ul>
            <li>Dashboard</li>
            <li>Students</li>
            <li>Faculty</li>
            <li>Courses</li>
            <li>Fees</li>
            <li>Settings</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">
        <header>
            <h1>Dashboard</h1>
        </header>

        <div class="cards">
            <div class="card">
                <h3>Students</h3>
                <p>1200</p>
            </div>
            <div class="card">
                <h3>Faculty</h3>
                <p>75</p>
            </div>
            <div class="card">
                <h3>Courses</h3>
                <p>35</p>
            </div>
            <div class="card">
                <h3>Fees Collected</h3>
                <p>₹25L</p>
            </div>
        </div>

        <div class="table-section">
            <h2>Recent Admissions</h2>
            <table>
                <tr>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Status</th>
                </tr>
                <tr>
                    <td>Rahul Patil</td>
                    <td>B.Tech</td>
                    <td>Approved</td>
                </tr>
                <tr>
                    <td>Priya Sharma</td>
                    <td>BCA</td>
                    <td>Pending</td>
                </tr>
                <tr>
                    <td>Amit Joshi</td>
                    <td>MBA</td>
                    <td>Approved</td>
                </tr>
            </table>
        </div>

    </div>

</div>

</body>
</html>
