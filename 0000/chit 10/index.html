<!DOCTYPE html>
<html>
<head>
    <title>User Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>User Registration Form</h2>

    <form>

        <!-- Name -->
        <label>Name:</label>
        <input type="text" required>

        <!-- Password -->
        <label>Password:</label>
        <input type="password" required>

        <!-- Email -->
        <label>Email:</label>
        <input type="email" placeholder="name@domain.com" required>

        <!-- Phone -->
        <label>Phone Number:</label>
        <select>
            <option>+91</option>
            <option>+1</option>
            <option>+44</option>
        </select>
        <input type="tel" pattern="[0-9]{10}" placeholder="10 digit mobile number" required>

        <!-- Gender -->
        <div class="gender">
            <label>Sex:</label><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
        </div>

        <!-- DOB -->
        <label>Date of Birth:</label>
        <select>
            <option>Day</option>
            <option>1</option><option>2</option><option>3</option>
        </select>

        <select>
            <option>Month</option>
            <option>Jan</option><option>Feb</option>
        </select>

        <select>
            <option>Year</option>
            <option>2000</option><option>2001</option>
        </select>

        <!-- Languages -->
        <div class="languages">
            <label>Languages Known:</label><br>
            <input type="checkbox"> English
            <input type="checkbox"> Marathi
            <input type="checkbox"> Hindi
            <input type="checkbox"> Tamil
        </div>

        <!-- Address -->
        <label>Address:</label>
        <textarea rows="3"></textarea>

        <!-- Submit -->
        <button type="submit">Register</button>

    </form>
</div>

</body>
</html>
