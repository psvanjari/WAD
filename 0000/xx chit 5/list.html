<!DOCTYPE html>
<html>
<head>
    <title>User List</title>
</head>
<body>

<h2>Registered Users</h2>
<div id="output"></div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];

let output = "";

if (users.length === 0) {
    output = "No users found!";
} else {
    users.forEach((user, index) => {
        output += `
            <p>
                <b>User ${index + 1}</b><br>
                Name: ${user.name}<br>
                Email: ${user.email}<br>
                Phone: ${user.phone}
            </p>
            <hr>
        `;
    });
}

document.getElementById("output").innerHTML = output;
</script>

</body>
</html>
