<!DOCTYPE html>
<html>
<head>
    <title>Registered Users</title>
</head>
<body>

<h2>User List</h2>

<table border="1">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody id="userTable"></tbody>
</table>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];

let table = document.getElementById("userTable");

users.forEach(function(user) {
    let row = `<tr>
        <td>${user.name}</td>
        <td>${user.email}</td>
    </tr>`;
    table.innerHTML += row;
});
</script>

</body>
</html>
